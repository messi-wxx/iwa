<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BPMN Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #fff;
        }
        #canvas {
            width: 100%;
            height: 100%;
            background: #fff;
        }
        .bjs-powered-by { display: none !important; }

        /* 高亮样式 */
        .highlight-node:not(.djs-connection) .djs-visual > :first-child {
            stroke: #2e7d32 !important;
            stroke-width: 3px !important;
            fill: #c8e6c9 !important;
            filter: drop-shadow(0 0 4px rgba(46,125,50,0.3));
        }
        .highlight-node.djs-connection .djs-visual path {
            stroke: #2e7d32 !important;
            stroke-width: 2.5px !important;
        }
        .active-node:not(.djs-connection) .djs-visual > :first-child {
            stroke: #c62828 !important;
            stroke-width: 3px !important;
            fill: #ffcdd2 !important;
            filter: drop-shadow(0 0 5px rgba(198,40,40,0.4));
        }
        .highlight-node.active-node:not(.djs-connection) .djs-visual > :first-child {
            stroke: #ff6d00 !important;
            stroke-width: 4px !important;
            fill: #ffe0b2 !important;
        }
    </style>
    <script src="file:///android_asset/bpmn-viewer.production.min.js"></script>
</head>
<body>
<div id="canvas"></div>
<script>
    (function() {
        var viewer = null;
        var pendingRender = null;
        var isRendering = false;
        var renderTimeout = null;

        // 手势相关变量
        var initialDistance = 0;
        var initialZoom = 1;
        var isPinching = false;

        var startX = 0, startY = 0;
        var isPanning = false;

        // ---------- 辅助函数 ----------
        function log(msg) {
            console.log('[BPMN] ' + msg);
        }

        function errorLog(msg) {
            console.error('[BPMN] ' + msg);
        }

        function notifyComplete() {
            if (window.Android && window.Android.onBpmnRenderComplete) {
                try {
                    window.Android.onBpmnRenderComplete();
                    log("已通知原生：渲染完成");
                } catch(e) { errorLog("通知完成失败: " + e); }
            }
        }

        function notifyError(errMsg) {
            if (window.Android && window.Android.onBpmnRenderError) {
                try {
                    window.Android.onBpmnRenderError(errMsg);
                    errorLog("已通知原生：错误 - " + errMsg);
                } catch(e) {}
            }
        }

        function clearAllHighlights() {
            if (!viewer) return;
            try {
                var canvasNode = document.getElementById('canvas');
                if (canvasNode) {
                    var els = canvasNode.querySelectorAll('.djs-element');
                    els.forEach(function(el) { el.classList.remove('highlight-node', 'active-node'); });
                }
                var elementRegistry = viewer.get('elementRegistry');
                if (elementRegistry) {
                    var all = elementRegistry.getAll();
                    all.forEach(function(shape) {
                        var gfx = elementRegistry.getGraphics(shape);
                        if (gfx) gfx.classList.remove('highlight-node', 'active-node');
                    });
                }
            } catch(e) { errorLog("清除高亮异常: " + e); }
        }

        function applyHighlights(nodeIds, className) {
            if (!nodeIds || !nodeIds.length) return;
            if (!viewer) return;
            var elementRegistry = viewer.get('elementRegistry');
            if (!elementRegistry) return;
            var uniqueIds = [];
            for (var i = 0; i < nodeIds.length; i++) {
                if (uniqueIds.indexOf(nodeIds[i]) === -1) uniqueIds.push(nodeIds[i]);
            }
            for (var j = 0; j < uniqueIds.length; j++) {
                var id = uniqueIds[j];
                var shape = elementRegistry.get(id);
                if (shape) {
                    var gfx = elementRegistry.getGraphics(shape);
                    if (gfx) gfx.classList.add(className);
                }
            }
        }

        function centerDiagram() {
            if (!viewer) return;
            var canvasApi = viewer.get('canvas');
            var elementRegistry = viewer.get('elementRegistry');
            if (!canvasApi || !elementRegistry) return;
            try {
                var allShapes = elementRegistry.getAll();
                var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                var hasValid = false;
                for (var i = 0; i < allShapes.length; i++) {
                    var s = allShapes[i];
                    if (s.x !== undefined && s.y !== undefined && s.width && s.height) {
                        minX = Math.min(minX, s.x);
                        minY = Math.min(minY, s.y);
                        maxX = Math.max(maxX, s.x + s.width);
                        maxY = Math.max(maxY, s.y + s.height);
                        hasValid = true;
                    }
                }
                if (!hasValid) return;

                var container = document.getElementById('canvas');
                var cw = container.clientWidth, ch = container.clientHeight;
                var dw = maxX - minX, dh = maxY - minY;
                var scaleX = (cw * 0.9) / dw;
                var scaleY = (ch * 0.9) / dh;
                var scale = Math.min(scaleX, scaleY, 1.5);
                var centerX = minX + dw/2;
                var centerY = minY + dh/2;
                var vw = cw / scale;
                var vh = ch / scale;
                var vx = centerX - vw/2;
                var vy = centerY - vh/2;
                canvasApi.zoom(scale);
                canvasApi.viewbox({ x: vx, y: vy, width: vw, height: vh });
                log("居中完成，缩放比例: " + scale);
            } catch(e) { errorLog("居中失败: " + e); }
        }

        // ----- 手动实现双指缩放 + 单指平移 -----
        function enableManualGestures() {
            var canvasElement = document.getElementById('canvas');
            if (!canvasElement) return;

            canvasElement.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    // 双指：准备缩放
                    e.preventDefault();
                    var dx = e.touches[0].clientX - e.touches[1].clientX;
                    var dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialDistance = Math.sqrt(dx * dx + dy * dy);
                    if (viewer) {
                        var canvasApi = viewer.get('canvas');
                        if (canvasApi) initialZoom = canvasApi.zoom();
                    }
                    isPinching = true;
                    isPanning = false;
                } else if (e.touches.length === 1) {
                    // 单指：准备平移
                    e.preventDefault();
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isPanning = true;
                    isPinching = false;
                }
            });

            canvasElement.addEventListener('touchmove', function(e) {
                if (isPinching && e.touches.length === 2) {
                    e.preventDefault();
                    var dx = e.touches[0].clientX - e.touches[1].clientX;
                    var dy = e.touches[0].clientY - e.touches[1].clientY;
                    var currentDistance = Math.sqrt(dx * dx + dy * dy);
                    if (initialDistance > 0 && viewer) {
                        var scaleFactor = currentDistance / initialDistance;
                        var newZoom = initialZoom * scaleFactor;
                        newZoom = Math.min(5, Math.max(0.2, newZoom));
                        var canvasApi = viewer.get('canvas');
                        if (canvasApi) {
                            canvasApi.zoom(newZoom);
                            log("缩放: " + newZoom.toFixed(2));
                        }
                    }
                } else if (isPanning && e.touches.length === 1 && viewer) {
                    e.preventDefault();
                    var currentX = e.touches[0].clientX;
                    var currentY = e.touches[0].clientY;
                    var deltaX = currentX - startX;
                    var deltaY = currentY - startY;
                    if (deltaX !== 0 || deltaY !== 0) {
                        var canvasApi = viewer.get('canvas');
                        if (canvasApi) {
                            canvasApi.scroll({ dx: deltaX, dy: deltaY });
                            startX = currentX;
                            startY = currentY;
                            log("平移: dx=" + deltaX + ", dy=" + deltaY);
                        }
                    }
                }
            });

            canvasElement.addEventListener('touchend', function(e) {
                isPinching = false;
                isPanning = false;
                initialDistance = 0;
            });
        }

        // 核心渲染函数
        function doRender(xmlStr, highlightArr, activeArr) {
            if (!viewer) {
                errorLog("doRender 但 viewer 未初始化");
                notifyError("Viewer未就绪");
                return false;
            }
            if (isRendering) {
                log("已有渲染任务，缓存最新请求");
                pendingRender = { xml: xmlStr, highlight: highlightArr, active: activeArr };
                return false;
            }
            isRendering = true;
            clearAllHighlights();

            if (renderTimeout) clearTimeout(renderTimeout);
            renderTimeout = setTimeout(function() {
                if (isRendering) {
                    errorLog("渲染超时（10s）");
                    notifyError("渲染超时，请检查XML或网络");
                    isRendering = false;
                    if (viewer && viewer.clear) viewer.clear();
                }
            }, 10000);

            log("开始导入XML，长度: " + xmlStr.length);
            viewer.importXML(xmlStr)
                .then(function() {
                    log("XML解析成功");
                    return new Promise(function(resolve) {
                        setTimeout(function() {
                            try {
                                centerDiagram();
                                if (highlightArr && highlightArr.length) applyHighlights(highlightArr, 'highlight-node');
                                if (activeArr && activeArr.length) applyHighlights(activeArr, 'active-node');
                                resolve();
                            } catch(e) {
                                errorLog("居中/高亮异常: " + e);
                                resolve();
                            }
                        }, 150);
                    });
                })
                .then(function() {
                    clearTimeout(renderTimeout);
                    isRendering = false;
                    notifyComplete();
                    log("渲染全流程完成");
                    if (pendingRender) {
                        var pr = pendingRender;
                        pendingRender = null;
                        doRender(pr.xml, pr.highlight, pr.active);
                    }
                })
                .catch(function(err) {
                    clearTimeout(renderTimeout);
                    isRendering = false;
                    var msg = err.message || String(err);
                    errorLog("导入失败: " + msg);
                    notifyError("渲染失败: " + msg);
                    if (viewer && viewer.clear) viewer.clear();
                });
            return true;
        }

        window.renderBpmn = function(xmlString, highlightNodeIds, activeNodeIds) {
            log("renderBpmn 被调用, xml长度: " + (xmlString ? xmlString.length : 0));
            if (!xmlString || xmlString.length < 50) {
                notifyError("XML内容过短或为空");
                return;
            }
            var hArr = Array.isArray(highlightNodeIds) ? highlightNodeIds : [];
            var aArr = Array.isArray(activeNodeIds) ? activeNodeIds : [];
            doRender(xmlString, hArr, aArr);
        };

        window.updateHighlights = function(highlightNodeIds, activeNodeIds) {
            if (!viewer || isRendering) return;
            clearAllHighlights();
            if (highlightNodeIds && highlightNodeIds.length) applyHighlights(highlightNodeIds, 'highlight-node');
            if (activeNodeIds && activeNodeIds.length) applyHighlights(activeNodeIds, 'active-node');
        };

        function initViewer(retryCount) {
            retryCount = retryCount || 0;
            if (typeof BpmnJS === 'undefined') {
                if (retryCount < 20) {
                    setTimeout(function() { initViewer(retryCount + 1); }, 200);
                } else {
                    errorLog("BpmnJS 库加载超时");
                    notifyError("BpmnJS库加载失败，请检查网络");
                }
                return;
            }
            try {
                viewer = new BpmnJS({ container: '#canvas' });
                log("BpmnViewer 初始化成功");
                enableManualGestures();  // 启用手势缩放+平移
                if (pendingRender) {
                    var pr = pendingRender;
                    pendingRender = null;
                    doRender(pr.xml, pr.highlight, pr.active);
                }
            } catch(e) {
                errorLog("初始化失败: " + e);
                notifyError("Viewer初始化失败: " + e.message);
            }
        }

        initViewer();
    })();
</script>
</body>
</html>
